<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সদস্য ফরম</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0b6b2e;--r:#d4101f;--bg:#e9eef0;--ink:#12261a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2220}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 0 40px}
.wrap{width:100%;overflow:hidden;position:relative}
#card{width:560px;transform-origin:top left;background:#fff;position:relative;overflow:hidden;color:var(--ink)}
.top{height:215px;background:linear-gradient(#7cc4ee,#d9f0fb 70%,#fff);position:relative}
.top svg{position:absolute;left:8px;top:8px}
.top h1{position:absolute;left:130px;right:120px;top:2px;margin:0;font-size:34px;line-height:1.25;color:var(--g);text-align:center;font-weight:700}
.pill{position:absolute;left:170px;top:68px;background:#143f7a;color:#fff;border-radius:20px;padding:0 22px;font-size:20px;font-weight:600;line-height:34px}
.house{position:absolute;right:6px;top:36px}
.rib{position:absolute;left:105px;right:105px;top:112px;background:var(--r);color:#fff;text-align:center;font-size:44px;font-weight:700;line-height:68px;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}
.curve{position:absolute;left:-40px;right:-40px;bottom:-60px;height:90px;background:#fff;border-radius:50%;border-top:5px solid #f4c20d}
.sec{margin:6px 14px 0;border:1.5px solid var(--g);border-radius:14px;padding:26px 14px 10px;position:relative}
.sec+.sec{margin-top:30px}
.tag{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;border-radius:20px;padding:0 28px;line-height:34px;font-size:22px;font-weight:600;white-space:nowrap}
.row{display:flex;align-items:flex-end;margin:2px 0;min-height:30px}
.row label{width:150px;flex:none;font-size:16px;font-weight:500;line-height:28px}
.row b{margin:0 6px;font-weight:600}
.row input{flex:1;min-width:0;border:0;border-bottom:1.5px dotted #333;background:transparent;font:inherit;font-size:16px;color:#0a3d9a;padding:0 2px;height:28px;outline:0;border-radius:0}
.row input:focus{border-bottom-color:var(--r)}
.row.short{margin-right:118px}
.photo{position:absolute;right:14px;top:22px;width:104px;height:128px;border:2px dashed var(--g);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--g);cursor:pointer;overflow:hidden;background:#f3faf5}
.photo img{width:100%;height:100%;object-fit:cover;display:none}
.share{display:flex;align-items:center;gap:8px;background:#fdf4cf;border:1.5px solid #e4c04a;border-radius:14px;padding:4px 14px;margin-top:8px;font-size:19px;font-weight:700;color:#14307a}
.share input{flex:1;min-width:0;border:0;border-bottom:1.5px dotted #333;background:transparent;font:inherit;font-size:17px;color:#0a3d9a;height:28px;outline:0}
.share small{font-size:15px;font-weight:500;color:var(--ink);white-space:nowrap}.share small em{color:var(--r);font-style:normal;font-weight:700;font-size:19px}
.n .row label{width:120px}
.foot{margin-top:18px;height:96px;background:linear-gradient(#fff 0,#e3f3d8 35%,#0f5a26 36%);text-align:center;position:relative}
.foot div{position:absolute;bottom:0;left:0;right:0;line-height:52px;color:#fff;font-size:26px;font-weight:600;background:#0f5a26}
.foot svg{position:absolute;left:0;right:0;top:8px}
.bar{width:100%;max-width:560px;padding:14px;display:flex;gap:10px;position:sticky;bottom:0}
.bar button{flex:1;border:0;border-radius:12px;padding:14px;font:600 17px 'Hind Siliguri',sans-serif;color:#fff;background:var(--g)}
.bar button.alt{background:#555}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;overflow:auto;padding:16px;z-index:9;color:#fff;text-align:center}
#ov img{width:100%;max-width:560px}
#ov button{margin:10px;padding:10px 22px;border-radius:10px;border:0;font-size:16px}
.hd,.ft{display:block;width:100%}.ft{margin-top:16px}.row label{width:190px!important;font-size:15.5px}.n .row label{width:154px!important}.row{min-height:27px}.share{font-size:20px}</style>
</head>

<div class="bar">
  <button id="dl">ছবি হিসেবে ডাউনলোড</button>
  <button class="alt" id="rs">রিসেট</button>
</div>
<div id="ov"><p>ছবিটি চেপে ধরে সেভ করুন</p><img id="oimg" alt=""><button id="oc">বন্ধ করুন</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const $=s=>document.querySelector(s);
function fit(){const c=$('#card'),w=$('.wrap'),s=Math.min(1,(w.clientWidth-8)/560);c.style.transform='scale('+s+')';c.style.marginLeft=Math.max(0,(w.clientWidth-560*s)/2)+'px';w.style.height=(c.offsetHeight*s)+'px'}
fit();addEventListener('resize',fit);document.fonts.ready.then(fit);addEventListener('load',fit);
const pbox=$('#pbox'),pimg=$('#pimg'),pfile=$('#pfile');
pbox.onclick=()=>pfile.click();
pfile.onchange=()=>{const f=pfile.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pimg.src=r.result;pimg.style.display='block';pbox.firstElementChild.style.display='none';pbox.style.borderStyle='solid'};r.readAsDataURL(f)};
$('#rs').onclick=()=>{document.querySelectorAll('[data-k]').forEach(i=>i.value='');pimg.removeAttribute('src');pimg.style.display='none';pbox.firstElementChild.style.display='';pbox.style.borderStyle='';pfile.value=''};
$('#oc').onclick=()=>$('#ov').style.display='none';
$('#dl').onclick=async()=>{
  const b=$('#dl'),t=b.textContent;b.textContent='অপেক্ষা করুন…';b.disabled=true;
  try{
    await document.fonts.ready;
    const c=await html2canvas($('#card'),{scale:2,backgroundColor:'#ffffff',useCORS:true,onclone:d=>{const k=d.querySelector('#card');k.style.transform='none';k.style.marginLeft='0'}});
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    if(/iPad|iPhone|iPod/.test(navigator.userAgent)){$('#oimg').src=c.toDataURL('image/png');$('#ov').style.display='flex'}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='member-form.png';document.body.appendChild(a);a.click();a.remove()}
  }catch(e){alert('ছবি তৈরি করা যায়নি')}
  b.textContent=t;b.disabled=false;
};
</script>
